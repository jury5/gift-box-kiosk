<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Your Gift Box!</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f4068, #162447);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 36px 32px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 420px;
            width: 100%;
        }
        h1 { margin: 0 0 10px; font-size: 24px; color: #e43f5a; }
        p { color: #cfd8dc; font-size: 14px; margin: 0 0 22px; }

        .field { text-align: left; margin-bottom: 12px; }
        .row { display: flex; gap: 10px; }
        .row .field { flex: 1; min-width: 0; }
        label { display: block; font-size: 12px; color: #90a4ae; margin-bottom: 4px; }
        input {
            width: 100%;
            padding: 11px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 16px;
            font-family: inherit;
        }
        input::placeholder { color: #78909c; }
        input:focus { outline: 2px solid #00adb5; outline-offset: 1px; }
        input:disabled { opacity: 0.6; }
        .hint { font-size: 12px; color: #90a4ae; margin: 2px 0 18px; text-align: left; }
        .consent { font-size: 11px; color: #78909c; margin: 14px 0 0; }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 15px;
            transition: 0.3s;
            font-family: inherit;
        }
        .btn-instagram { background: #e1306c; color: white; }
        .btn-instagram:hover { background: #c13584; }
        .btn-instagram.disabled {
            background: #455a64;
            color: #b0bec5;
            cursor: not-allowed;
        }
        .btn-claim { background: #00adb5; color: white; }
        .btn-claim:hover { background: #00818a; }
        .btn:disabled {
            background: #455a64;
            color: #b0bec5;
            cursor: not-allowed;
        }
        #status-msg { margin-top: 5px; font-size: 14px; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎁 Unlock Your Gift Box!</h1>
        <p>Enter your details, follow our Instagram page, then claim your prize. One gift box per person.</p>

        <!-- Step 1: Details -->
        <div class="row">
            <div class="field">
                <label for="name">Name</label>
                <input id="name" type="text" autocomplete="given-name" maxlength="80" placeholder="Name">
            </div>
            <div class="field">
                <label for="surname">Surname</label>
                <input id="surname" type="text" autocomplete="family-name" maxlength="80" placeholder="Surname">
            </div>
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" autocapitalize="off" maxlength="120" placeholder="you@example.com">
        </div>
        <div class="field">
            <label for="phone">Phone</label>
            <input id="phone" type="tel" autocomplete="tel" maxlength="30" placeholder="+90 5xx xxx xx xx">
        </div>
        <div class="hint">Name, surname and at least one of email or phone are required.</div>

        <!-- Step 2: Follow on Instagram (looks locked until the details are valid) -->
        <a href="https://instagram.com/ipkonbiscuit" target="_blank" rel="noopener"
           id="insta-btn" class="btn btn-instagram disabled" aria-disabled="true">
            2. Follow Us on Instagram
        </a>

        <!-- Step 3: Claim (locked until the server confirms you're a new user) -->
        <button id="claim-btn" class="btn btn-claim" disabled>
            3. Claim Your Gift Box!
        </button>

        <div id="status-msg" role="status" aria-live="polite"></div>
        <p class="consent">We store your details to run this giveaway and to contact you about future offers.</p>
    </div>

    <script>
        const fields = ['name', 'surname', 'email', 'phone'].map(id => document.getElementById(id));
        const [nameEl, surnameEl, emailEl, phoneEl] = fields;
        const instaBtn = document.getElementById('insta-btn');
        const claimBtn = document.getElementById('claim-btn');
        const statusMsg = document.getElementById('status-msg');

        let claimToken = null;

        function setStatus(text, color) {
            statusMsg.style.color = color || '#cfd8dc';
            statusMsg.innerText = text;
        }

        // Returns a message describing what is wrong, or null if the form is valid
        function getProblem() {
            const name = nameEl.value.trim();
            const surname = surnameEl.value.trim();
            const email = emailEl.value.trim();
            const phoneRaw = phoneEl.value.trim();
            const phoneDigits = phoneRaw.replace(/\D/g, '');

            if (!name) return 'Enter your name.';
            if (!surname) return 'Enter your surname.';
            if (!email && !phoneRaw) return 'Enter an email or a phone number.';
            if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return 'Enter a valid email address.';
            if (phoneRaw && (phoneDigits.length < 7 || phoneDigits.length > 15)) return 'Enter a valid phone number (7 to 15 digits).';
            return null;
        }

        function refreshInstagramButton() {
            const ok = getProblem() === null;
            instaBtn.classList.toggle('disabled', !ok);
            instaBtn.setAttribute('aria-disabled', String(!ok));
        }

        // Editing anything after the check invalidates it
        function onFieldEdited() {
            if (claimToken !== null) {
                claimToken = null;
                claimBtn.disabled = true;
                setStatus('');
            }
            refreshInstagramButton();
        }

        // Several events + polling, because mobile autofill/paste/suggestions
        // don't always fire "input"
        fields.forEach(el => {
            ['input', 'change', 'keyup', 'paste', 'blur'].forEach(evt =>
                el.addEventListener(evt, () => setTimeout(onFieldEdited, 0))
            );
        });
        setInterval(refreshInstagramButton, 500);

        // Clicking Instagram: if the form is incomplete, say why. Otherwise
        // let the link open and ask the server in parallel.
        instaBtn.addEventListener('click', async (e) => {
            const problem = getProblem();
            if (problem) {
                e.preventDefault();
                setStatus(problem, '#f44336');
                return;
            }

            setStatus('Checking your details...', '#ffeb3b');
            claimBtn.disabled = true;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: nameEl.value,
                        surname: surnameEl.value,
                        email: emailEl.value,
                        phone: phoneEl.value
                    })
                });
                const result = await res.json();

                if (result.eligible) {
                    claimToken = result.token;
                    claimBtn.disabled = false;
                    setStatus('Thanks for following! You can now claim your gift box.', '#00adb5');
                } else {
                    claimToken = null;
                    claimBtn.disabled = true;
                    setStatus(result.message || 'You are not eligible for a gift box.', '#f44336');
                }
            } catch (err) {
                setStatus('Connection problem. Please tap the Instagram button again.', '#f44336');
            }
        });

        claimBtn.addEventListener('click', async () => {
            if (!claimToken) return;

            claimBtn.disabled = true;
            setStatus('Opening your gift box...', '#ffeb3b');

            try {
                const res = await fetch('/claim', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: claimToken })
                });
                const result = await res.json();

                if (res.ok) {
                    setStatus('Success! Your gift box is opening now! 🎉', '#4caf50');
                    fields.forEach(el => el.disabled = true);
                    instaBtn.classList.add('disabled');
                    claimToken = null;
                } else {
                    throw new Error(result.message || 'Failed to trigger');
                }
            } catch (err) {
                setStatus(err.message || 'Error triggering machine. Try again!', '#f44336');
                claimBtn.disabled = false;
            }
        });

        refreshInstagramButton();
    </script>
</body>
</html>
